name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v
      - name: Trazabilidad spec → pruebas
        run: python tools/check_trazabilidad.py
      - name: Contrato OpenAPI → API real
        run: python tools/check_contrato.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wallet-onboarding-mvp .
